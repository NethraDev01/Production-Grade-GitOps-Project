
name: Microservice CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Generate lowercase image name with SHA tag
      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          SERVICE_LC=$(echo "${{ inputs.service }}" | tr '[:upper:]' '[:lower:]')

          IMAGE_NAME="ghcr.io/${OWNER_LC}/microservices-demo/${SERVICE_LC}:sha-${GITHUB_SHA}"

          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "Generated image: $IMAGE_NAME"

      # Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Docker image
      - name: Build Image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
        run: |
          docker build \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t "$IMAGE_NAME" \
            ./src/${{ inputs.service }}

      # Security Scan
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.image_name }}
          severity: HIGH,CRITICAL
          exit-code: 0
          vuln-type: os,library

      # Push image
      - name: Push Image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
        run: |
          docker push "$IMAGE_NAME"
